; THE LOOPBACK TELEMETRY RANGE (ROAD-3478). Every agent that serves its own
; `GET /status` / `GET /telemetry` on 127.0.0.1 (apk-plugin-runner's
; loopback.rs, the Python twin's LoopbackServer, contracts 0.9.0) takes ONE
; port from this range, and declares it in ITS OWN `agent.toml`
; (`[telemetry] port = N`) — or, for a roster agent of NODE.BareMetal, in
; agents.json `"telemetry": {"port": N}`. There is no list of who has which:
; the files are the registry, and `check-loopback-ports.py` (run by
; SRC/check.sh) reads them all and refuses a port outside the range or a port
; two agents claim.
;
; WHY ONE RANGE ON THE HOST. Plugins are host-networked, so their loopback is
; the node's and two agents on one port would mean the second one's bind fails
; and it reads `unknown` for ever. A bridge-networked container has its own
; loopback (the supervisor cannot reach it there), but it still takes a port
; from the range, so a move to host networking needs no renumbering.
;
; WHY HERE. 8100 (NODE.BareMetal's supervisor), 8120 (the Discovery Engine),
; 8130 (PLUGIN.AES67's pages), 8140 (PLUGIN.CHROMECAST's media / PLUGIN.SNMP
; inside its compose network) and 8150 (CONTROL.YoControl, opt-in) are service
; ports below it; nothing listens on 8190-8259 except these servers. Plugin-SAP
; took 8190 first (ROAD-3472).
;
; A NEW AGENT takes the next free port; `check-loopback-ports.py --next`
; prints it. `APK_TELEMETRY_PORT` moves one process at run time (0 = off) and is
; not checked here — it is for a bench, not for a declaration.

[loopback]
first = 8190
last = 8259
