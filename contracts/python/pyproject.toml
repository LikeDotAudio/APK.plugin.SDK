[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkaudio_contracts"
version = "2.0.0"
description = "Python binding for APK.audio bus contracts and topics"
authors = [{ name = "Anthony Kuzub", email = "anthony@apk.audio" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.0.0"]

[tool.setuptools.package-data]
# GENERATED by contracts/scripts/gen.ts (gen:check holds it): families.py builds from it.
apkaudio_contracts = ["topic_grammar.json", "brand.json", "state.json"]
