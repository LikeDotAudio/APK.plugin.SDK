# The common part of every plugin container — `extends:`-ed by each plugin
# stack's docker-compose.yml, never run on its own.
#
# WHY `extends:` AND NOT THE `x-plugin: &plugin` ANCHOR audit §10.3 sketched: an
# anchor cannot cross files, and every container is its own stack folder at the
# pod root (PLUGIN.DANTE, PLUGIN.MILAN, …). `extends` is compose's
# cross-file form of the same merge. What it does NOT carry is a top-level
# `volumes:` declaration, so each plugin file repeats the two volumes it mounts.
#
# PATHS: an extended service's relative paths resolve against THIS file, so
# `../../../..` below is the repo root no matter which stack extends it.
#
# TWO SHAPES, because the network decides where the broker is:
#   plugin-host    network_mode: host — everything that hunts the LAN
#                  (multicast, mDNS, AF_PACKET). 127.0.0.1 IS the host's broker.
#   plugin-bridge  the default bridge — switch/NetBox agents that only make
#                  unicast calls. 127.0.0.1 is the container itself there, so the
#                  broker is reached through host.docker.internal.

services:
  plugin-host:
    build: &plugin-build
      context: "../../../.."
      dockerfile: "PODS/POD.THICK/DISCOVERY.Engine/Docker/Dockerfile"   # relative to the context
      target: plugins
    image: apk-plugins:local
    restart: unless-stopped
    # A REAL PID 1 (LOOSE-discovery-engine-plugin-containers-ignore). The kernel
    # gives PID 1 no default action for SIGTERM, so a plugin binary that was
    # PID 1 sat out every `docker stop` grace and was SIGKILLed (Exited 137).
    # docker-init forwards the signal and reaps; the runner's own SIGTERM
    # handler then exits 143 within a second. Both, so a binary not on the
    # runner stops too.
    init: true
    network_mode: host
    # NOTHING BUT WHAT A PLUGIN ASKS FOR. The orchestrator held NET_RAW,
    # NET_ADMIN and NET_BIND_SERVICE for all of them; here every plugin starts
    # from none, and only the few that need one add it back: NET_RAW for
    # PLUGIN.MILAN, PLUGIN.PTP and PLUGIN.PING;
    # NET_BIND_SERVICE for PTP, AES67 and the engine. NET_ADMIN for none.
    # ⚠️ DO NOT ADD `security_opt: [no-new-privileges:true]`: those gain
    #    their capabilities from FILE caps at exec, which that flag forbids.
    cap_drop: [ALL]
    read_only: true
    # The runner's health file, on the only writable path of a read-only root.
    tmpfs:
      - /tmp
    environment: &plugin-environment
      # THE BAREMETAL NODE'S OWN VARIABLE, for the reason its compose file gives:
      # a bare MQTT_HOST is also read by the bridge-networked stacks, with a
      # default that cannot resolve inside a host-networked container.
      MQTT_HOST: ${APK_BAREMETAL_MQTT_HOST:-127.0.0.1}
      MQTT_PORT: ${APK_BAREMETAL_MQTT_PORT:-1883}
      APK_MQTT_USERNAME: ${APK_MQTT_USERNAME:-}
      APK_MQTT_PASSWORD: ${APK_MQTT_PASSWORD:-}
      APK_NODE: ${APK_NODE:-}
      APK_IMAGE_REV: ${APK_IMAGE_REV:-unstamped}
    volumes:
      # LOGGER STORAGE — owned by DATABSE:volume:Log STORAGE, which is up first.
      - type: volume
        source: apk-audio-logs
        target: /logs
      # One OUI cache for every plugin that names a vendor (twelve of them), or
      # each container keeps its own and asks the API twelve times.
      - type: volume
        source: mac-lookup-cache
        target: /var/lib/apkaudio/mac
    healthcheck:
      # Reads the timestamp the runner's telemetry tick writes into /tmp. A
      # plugin whose binary is not built on apk-plugin-runner overrides this
      # with `disable: true` rather than being reported unhealthy forever.
      test: ["CMD", "apk-plugin-health"]
      interval: 60s   # PLAN-3385.01: was 15s; a probe is a docker exec, most of an idle container's CPU
      start_interval: 5s   # fast while starting, so depends_on: service_healthy is not slowed
      timeout: 5s
      retries: 3
      start_period: 20s

  plugin-bridge:
    build: *plugin-build
    image: apk-plugins:local
    restart: unless-stopped
    init: true   # see plugin-host
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *plugin-environment
      # THE BROKER BY NAME, ON THE COMPOSE NETWORK (PLAN-3378.01). These
      # bridge-networked plugins used to dial host.docker.internal:1883, the
      # broker's HOST port, which is why that port had to be open beyond
      # loopback. They share `apk-audio_default` with Broker-Mosquitto, whose
      # `broker` alias answers there; the host port is loopback-only now.
      MQTT_HOST: ${APK_PLUGIN_BRIDGE_MQTT_HOST:-broker}
    volumes:
      - type: volume
        source: apk-audio-logs
        target: /logs
      - type: volume
        source: mac-lookup-cache
        target: /var/lib/apkaudio/mac
    healthcheck:
      test: ["CMD", "apk-plugin-health"]
      interval: 60s   # PLAN-3385.01: was 15s; a probe is a docker exec, most of an idle container's CPU
      start_interval: 5s   # fast while starting, so depends_on: service_healthy is not slowed
      timeout: 5s
      retries: 3
      start_period: 20s

# DECLARED FOR THIS FILE'S OWN PARSE ONLY. `extends:` carries a service, never
# a top-level `volumes:` — what a running plugin gets is the block in its own
# stack file, which every plugin repeats. Kept identical to that block (NOT
# `external:`, PLAN-3399.01; the owner's bind, LOOSE-plugin-osc) so nobody
# reads a rule here that applies nowhere.
volumes:
  apk-audio-logs:
    name: apk-audio-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${APKAUDIO_REPO:-${PWD}}/Documentation/LOGS"
  mac-lookup-cache:
    name: apk-audio-mac-lookup-cache
